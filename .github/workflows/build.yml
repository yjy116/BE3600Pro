name: BE3600 Pro Wired p8

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      config_only:
        description: '仅验证真实 defconfig，不编译固件'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Validate scripts and acceptance checks
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find package -type f -path '*/files/*' -exec sh -n {} \;
          python3 -m compileall -q scripts tests
          timeout 60s python3 -m unittest discover -s tests -v

  firmware:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Reclaim disposable runner SDK space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h
      - name: Install build dependencies
        run: bash scripts/install_dependencies.sh
      - name: Prepare upstream and additive plugins
        run: |
          mkdir -p artifacts
          bash scripts/prepare.sh 2>&1 | tee artifacts/prepare.log
      - name: Compile and verify firmware
        if: ${{ !inputs.config_only }}
        run: bash scripts/build.sh
      - name: Upload configuration and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node.js 24
        with:
          name: be3600pro-p8-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified firmware
        if: ${{ success() && !inputs.config_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > artifacts/release-notes.md <<'EOF'
          Xiaomi BE3600 Pro Wired **8 网口版 p8**，仅有线。

          默认管理地址：192.168.70.1。

          保留 owrt 默认包及 PoE 管理，增补 AX6600 应用。原有包优先使用上游 feeds。
          包含 Aurora 主题及设置插件；DAED 使用项目正式版 2.1.1，保留官方 LuCI 管理入口。
          manifest、profiles.json、sha256sums 与固件一同保留；配置与日志见本次 Actions artifact。
          编译及静态产物验证不代表实机验证；未执行刷机、PoE 供电或代理运行验证。
          factory.ubi 不代表已确认可通过原厂网页刷入。
          EOF
          printf '\nSource SHA: %s\nBuild run: %s\n' \
            "$(cat artifacts/firmware-sha.txt)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >> artifacts/release-notes.md
          gh release create "p8-$GITHUB_RUN_ID" artifacts/firmware/* \
            --target "$GITHUB_SHA" --title "BE3600 Pro Wired p8 - $GITHUB_RUN_ID" \
            --notes-file artifacts/release-notes.md
